# Production compose for Dokploy.
#
# Differences vs docker-compose.yml (the dev file):
#   - No container_name (Dokploy prefixes containers per-project; static
#     names collide on redeploy).
#   - No host port mappings on postgres/redis — only reachable on the
#     internal compose network.
#   - backend joins the external dokploy-network and is published via
#     Traefik labels instead of a host port; Dokploy's Traefik handles
#     TLS via Let's Encrypt.
#   - No bind-mount and no --reload — the image is the source of truth.
#
# Required env vars (set in the Dokploy "Environment" tab — this file
# does NOT load a .env, so Dokploy is the only source of secrets):
#   APP_DOMAIN          e.g. api.yourdomain.com
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   REDIS_PASSWORD
#   MODEL_API_KEY, OPENAI_API_KEY, LOGFIRE_TOKEN, MODEL_NAME, DEBUG
#
# DATABASE_URL and REDIS_URL are intentionally constructed below from
# the parts above, so a stray `localhost` in any .env can never override
# the in-container service hostnames `postgres` / `redis`.

services:
  backend:
    image: ottobiz:latest
    build:
      context: .
      dockerfile: dockerfile
    restart: always
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Built from POSTGRES_*/REDIS_PASSWORD set in Dokploy. Service names
      # `postgres` and `redis` resolve over the compose default network.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ottobiz}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0
      - LOG_FILE=/tmp/app.log
      # Pass-throughs from the Dokploy Environment tab. Use explicit
      # ${VAR} interpolation rather than bare names: Dokploy writes
      # env vars to a .env file used for compose interpolation, but
      # does not export them to the shell, so bare-name pass-throughs
      # come up empty in the container.
      - MODEL_NAME=${MODEL_NAME:-}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN:-}
      - DEBUG=${DEBUG:-}
      # WhatsApp Cloud API credentials. VERIFY_TOKEN is the shared
      # secret for the GET /webhooks/whatsapp handshake; APP_SECRET is
      # used to validate signatures on inbound POSTs; PAGE_ACCESS_TOKEN
      # is the long-lived token for sending messages out.
      - VERIFY_TOKEN=${VERIFY_TOKEN:-}
      - APP_SECRET=${APP_SECRET:-}
      - PAGE_ACCESS_TOKEN=${PAGE_ACCESS_TOKEN:-}
      # Auto-seeder for the WhatsApp business row. Without
      # WHATSAPP_PHONE_NUMBER_ID the resolver can't map inbound
      # webhooks to a tenant and drops them as "unknown_business".
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - SEED_BUSINESS_NAME=${SEED_BUSINESS_NAME:-}
      - SEED_BUSINESS_PHONE=${SEED_BUSINESS_PHONE:-}
      - SEED_BUSINESS_ID=${SEED_BUSINESS_ID:-}
      - SEED_PRODUCTS_CSV=${SEED_PRODUCTS_CSV:-}
      - SEED_CONTACTS_CSV=${SEED_CONTACTS_CSV:-}
      # Single-person tenants: set SEED_SELF_VENDOR=1 to auto-register the
      # operator's own phone (SEED_BUSINESS_PHONE) as a vendor contact, so
      # inbound messages from that number route through the outbound flow
      # instead of being dropped as owner self-messages.
      - SEED_SELF_VENDOR=${SEED_SELF_VENDOR:-}
      - SEED_SELF_VENDOR_NAME=${SEED_SELF_VENDOR_NAME:-}
      - SEED_SELF_VENDOR_ROLE=${SEED_SELF_VENDOR_ROLE:-}
      - SEED_SELF_VENDOR_NOTES=${SEED_SELF_VENDOR_NOTES:-}
    networks:
      - default
      - dokploy-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    # Ingress (host, port, TLS) is configured in the Dokploy "Domains"
    # tab on this compose service — Dokploy generates the right Traefik
    # configuration for its swarm-mode setup. Don't add traefik.* labels
    # here; on a swarm-provider Traefik they're picked up inconsistently
    # for non-swarm compose containers and conflict with Dokploy's own
    # config.

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ottobiz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ottobiz}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_data:/data
    networks:
      - default
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redispassword}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
  dokploy-network:
    external: true
